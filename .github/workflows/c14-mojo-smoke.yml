name: Mojo C14 reference (non-authoritative)

on:
  pull_request:
    paths:
      - 'experiments/c14/**'
      - '.github/workflows/c14-mojo-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mojo-c14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned estate-compatible Mojo SDK
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: experiments/c14/pixi.toml
      - name: Check Mojo compiler version
        run: pixi run --manifest-path experiments/c14/pixi.toml mojo --version
      - name: Run Mojo-first pattern oracle
        run: |
          pixi run --manifest-path experiments/c14/pixi.toml mojo run experiments/c14/c14_canonical.mojo | tee /tmp/c14-mojo.out
          grep -E '^P[[:space:]]+4[[:space:]]+392$' /tmp/c14-mojo.out
          grep -E '^P[[:space:]]+5[[:space:]]+33530$' /tmp/c14-mojo.out
          grep -E '^P[[:space:]]+6[[:space:]]+89782$' /tmp/c14-mojo.out
          grep -E '^P[[:space:]]+7[[:space:]]+38232$' /tmp/c14-mojo.out
