name: Ordinary cycle maximal-symbol mixed-factor oracle

on:
  pull_request:
    paths:
      - 'oracles/c2k/**'
      - 'tests/test_chord_gap_correspondence.py'
      - 'proof/even-cycle-order-symbol.md'
      - 'docs/research/c2k-chord-symbol-all-k-proof-2026-10-22.md'
      - '.github/workflows/c2k-symbol-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2k-symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Component gap and cyclic boundary regressions
        run: python3 -m unittest discover -s tests -p test_chord_gap_correspondence.py -v
      - name: Direct mixed-Cartesian-product DFS checks
        run: python3 oracles/c2k/verify_mixed_product_symbols.py
      - name: Independent chord-connectivity versus cube-prefix matching check through k=8
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra oracles/c2k/verify_chord_prefix_all8.cpp -o /tmp/gpr-verify-chord-prefix-all8
          /tmp/gpr-verify-chord-prefix-all8

